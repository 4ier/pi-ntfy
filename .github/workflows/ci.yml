name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Smoke-load the extension entry under plain Node
        run: |
          npx tsc -p tsconfig.json --noEmit false --outDir .tmp-build --rootDir .
          cat > .smoke.mjs <<'SMOKE'
          const mod = await import('./.tmp-build/src/index.js');
          if (typeof mod.default !== 'function') throw new Error('default export is not a function');

          const handlers = {}, commands = {}, tools = {};
          const noop = () => {};
          // A Proxy, not a hand-written stub: the factory grows new pi APIs over time and a
          // fixed stub turns every such addition into a red CI run that has nothing to do
          // with the change. We still record the registrations worth asserting on.
          const target = {
            on: (name, handler) => { handlers[name] = handler; },
            registerCommand: (name, definition) => { commands[name] = definition; },
            registerTool: (tool) => { tools[tool?.name ?? '?'] = tool; },
            events: { on: noop, emit: noop },
            appendEntry: noop,
          };
          const api = new Proxy(target, {
            get: (obj, prop) => (prop in obj ? obj[prop] : noop),
          });

          mod.default(api);

          if (!handlers.session_start) throw new Error('session_start not registered');
          if (!handlers.session_shutdown) throw new Error('session_shutdown not registered');
          if (!commands.ntfy) throw new Error('ntfy command not registered');
          console.log('smoke load ok; tools: ' + Object.keys(tools).join(',') + '; commands: ' + Object.keys(commands).join(','));
          SMOKE
          node .smoke.mjs
          rm -rf .tmp-build .smoke.mjs

      - name: Check the published artifact actually contains the extension
        run: |
          # The extension ships as TypeScript source (jiti loads it, there is no build
          # step), so a typo in `files` would make `pi install npm:@4ier/pi-ntfy`
          # install a package with no entry point while every other check stays green.
          npm pack --dry-run --json > pack.json
          node -e "
          const report = require('./pack.json');
          const files = (report[0]?.files ?? []).map((f) => f.path);
          const required = [
            'package.json',
            'README.md',
            'LICENSE',
            'src/index.ts',
            'src/config.ts',
            'src/ntfy.ts',
            'src/filter.ts',
            'src/template.ts',
            'src/state.ts',
            'src/log.ts',
          ];
          const missing = required.filter((p) => !files.includes(p));
          if (missing.length > 0) { throw new Error('published tarball is missing: ' + missing.join(', ')); }
          const manifest = require('./package.json');
          for (const entry of manifest.pi?.extensions ?? []) {
            const normalized = entry.startsWith('./') ? entry.slice(2) : entry;
            if (!files.includes(normalized)) { throw new Error('pi.extensions ' + entry + ' is not in the tarball'); }
          }
          console.log('pack contents ok: ' + files.length + ' files');
          "
          rm -f pack.json
