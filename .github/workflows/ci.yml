name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Smoke-load the extension entry under plain Node
        run: |
          npx tsc -p tsconfig.json --noEmit false --outDir .tmp-build --rootDir .
          node -e "
          import('./.tmp-build/src/index.js').then((m) => {
            if (typeof m.default !== 'function') { throw new Error('default export is not a function'); }
            const handlers = {}, commands = {};
            m.default({ on: (n, h) => { handlers[n] = h; }, registerCommand: (n, d) => { commands[n] = d; },
                        sendMessage() {}, sendUserMessage() {}, appendEntry() {},
                        events: { on() {}, emit() {} } });
            if (!handlers.session_start) { throw new Error('session_start not registered'); }
            if (!commands.ntfy) { throw new Error('ntfy command not registered'); }
            console.log('smoke load ok');
          }).catch((e) => { console.error(e); process.exit(1); });
          "
          rm -rf .tmp-build

      - name: Check the published artifact actually contains the extension
        run: |
          # The extension ships as TypeScript source (jiti loads it, there is no build
          # step), so a typo in `files` would make `pi install npm:@4ier/pi-ntfy`
          # install a package with no entry point while every other check stays green.
          npm pack --dry-run --json > pack.json
          node -e "
          const report = require('./pack.json');
          const files = (report[0]?.files ?? []).map((f) => f.path);
          const required = [
            'package.json',
            'README.md',
            'LICENSE',
            'src/index.ts',
            'src/config.ts',
            'src/ntfy.ts',
            'src/filter.ts',
            'src/template.ts',
            'src/state.ts',
            'src/log.ts',
          ];
          const missing = required.filter((p) => !files.includes(p));
          if (missing.length > 0) { throw new Error('published tarball is missing: ' + missing.join(', ')); }
          const manifest = require('./package.json');
          for (const entry of manifest.pi?.extensions ?? []) {
            const normalized = entry.startsWith('./') ? entry.slice(2) : entry;
            if (!files.includes(normalized)) { throw new Error('pi.extensions ' + entry + ' is not in the tarball'); }
          }
          console.log('pack contents ok: ' + files.length + ' files');
          "
          rm -f pack.json
