name: Publish

# 发布走 CI，不靠本机的 ~/.npmrc：
#   - token 只存在 GitHub Actions secret 里（NPM_TOKEN）
#   - 只有打了 v* 标签才发，避免误发
#   - 每次发布都带 provenance 证明（需要 id-token: write）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只做打包预演，不真正发布"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check the tarball contains the extension
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
          const files = require('./pack.json')[0].files.map((f) => f.path);
          const manifest = require('./package.json');
          for (const entry of manifest.pi?.extensions ?? []) {
            const normalized = entry.startsWith('./') ? entry.slice(2) : entry;
            if (!files.includes(normalized)) { throw new Error('pi.extensions ' + entry + ' missing from tarball'); }
          }
          console.log('pack ok: ' + files.length + ' files');
          "
          rm -f pack.json

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
