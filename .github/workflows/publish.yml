name: Publish

# 走 npm Trusted Publishing（OIDC），**不使用任何长期 npm token**。
#
# npm 已经在创建 token 的页面上明确劝阻为 CI/CD 建长期写权限 token
# （"please use Trusted Publishing instead"）：长期 token 会泄漏、会进日志、要人工轮换。
# Trusted Publishing 每次发布用一次性的、由工作流身份签出的短期凭证。
#
# 前提（在 npmjs.com 的包设置页里配一次）：
#   Trusted Publisher → GitHub Actions
#     Organization or user : 4ier
#     Repository           : pi-ntfy
#     Workflow filename    : publish.yml
#     Allowed actions      : 勾上 npm publish（默认只允许 stage publish）
#
# 另需 npm CLI >= 11.5.1 与 Node >= 22.14.0，下面显式升级 npm 以免依赖 Node 自带版本。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只做打包预演，不真正发布"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # OIDC：Trusted Publishing 与 provenance 都靠它

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 刻意**不传 registry-url**：那会让 setup-node 往 .npmrc 写一行
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`，而 NODE_AUTH_TOKEN 默认是
      # 占位符 `XXXXX-XXXXX-XXXXX-XXXXX`。走 OIDC 不需要任何 token，仓库根的
      # .npmrc 已经把 registry 钉在官方源上了。
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Ensure an npm CLI that supports trusted publishing
        run: |
          npm install -g npm@latest
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check the tarball contains the extension
        run: |
          # 别解析 `npm pack --json`。那个 JSON 的形状在不同 npm 版本/环境下会变
          # （同一个包：本地 npm 11.19 有 `files` 字段，CI 上我拿到的是完全不同的结构），
          # 曾经让这一步在 CI 上直接炸掉。列 tarball 内容才是 ground truth。
          mkdir -p /tmp/packcheck
          npm pack --pack-destination /tmp/packcheck > /tmp/packcheck/name.txt
          TARBALL=$(tail -n 1 /tmp/packcheck/name.txt)
          tar -tzf "/tmp/packcheck/$TARBALL" | sed 's|^package/||' | grep -v '/$' > /tmp/packcheck/files.txt
          node -e "
          const fs = require('fs');
          const files = fs.readFileSync('/tmp/packcheck/files.txt', 'utf8').split('\n').filter(Boolean);
          const manifest = require('./package.json');
          for (const entry of manifest.pi?.extensions ?? []) {
            const normalized = entry.startsWith('./') ? entry.slice(2) : entry;
            if (!files.includes(normalized)) { throw new Error('pi.extensions ' + entry + ' missing from tarball'); }
          }
          console.log('pack ok: ' + files.length + ' files, entry point present');
          "

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run --access public

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npm publish --provenance --access public
